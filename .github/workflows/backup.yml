name: Backup

on:
  schedule:
    # 03:17 UTC todos los días. GitHub puede demorar unos minutos.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fletar-backup
  cancel-in-progress: false

jobs:
  neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # El secreto no se puede evaluar en el `if` del job: se chequea acá.
      # Sin DATABASE_URL el backup se saltea en verde (no falla todos los días),
      # y apenas se carga el secret empieza a correr solo.
      - name: ¿Hay DATABASE_URL configurada?
        id: secreto
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin DATABASE_URL: se saltea el backup (ver FLETAR_BACKEND/docs/BACKUPS.md)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pg_dump de Neon
        if: steps.secreto.outputs.skip == 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backups
          docker run --rm \
            -v "$PWD/backups:/backup" \
            postgres:16 \
            pg_dump --dbname="$DATABASE_URL" \
              --format=custom --no-owner --no-privileges \
              --file="/backup/fletar-$(date -u +%Y%m%d-%H%M%S).dump"

      - name: Subir artefacto
        if: steps.secreto.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: fletar-neon-${{ github.run_id }}
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: error
